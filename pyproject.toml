[project]
name = "job-agent"
version = "0.1.0"
description = "An AI agent that helps you apply for jobs by generating personal statements and job questions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.21.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]
line-length = 108
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 108

[tool.pylint."messages_control"]
disable = [
    "C0114", # Missing module docstring
    "C0411", # Wrong import order
    "R0903", # Too few public methods
    "R0913", # Too many arguments
    "R0914", # Too many local variables
    "R0915", # Too many statements
    "R0917" # Too many positional arguments
]
